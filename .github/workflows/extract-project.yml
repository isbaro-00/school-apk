name: Extract Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/project
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP" -d /tmp/project

          ROOT=$(dirname "$(find /tmp/project -name pubspec.yaml -print -quit)")

          if [ -z "$ROOT" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          cp -a "$ROOT"/. .

      - name: Commit project structure
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add . \
            ':!.github/workflows/*'

          git commit -m "Extract complete Flutter project" || echo "Nothing to commit"

          git push
